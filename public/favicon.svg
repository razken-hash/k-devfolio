<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="k" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3038"/>
      <stop offset="1" stop-color="#16191e"/>
    </linearGradient>
    <linearGradient id="display" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e2117"/>
      <stop offset="1" stop-color="#030805"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b7280"/>
      <stop offset="1" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#374151"/>
      <stop offset="1" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g transform="translate(0 2)">
    <!-- Lid & bezel -->
    <rect x="8" y="1.5" width="48" height="34" rx="3" fill="url(#lid)" stroke="#4b5563" stroke-width="0.6"/>
    <circle cx="32" cy="3.1" r="0.55" fill="#0b0d10"/>

    <!-- Display -->
    <rect x="10.2" y="4.6" width="43.6" height="28.6" rx="0.8" fill="url(#display)"/>
    <rect x="10.2" y="4.6" width="43.6" height="28.6" rx="0.8" fill="#10b981" fill-opacity="0.1"/>

    <!-- K + cursor -->
    <path filter="url(#glow)" fill="url(#k)"
      d="M20.5 9 H26 V16.6 L31.6 9 H37.8 L30.2 18.4 L38.2 28.6 H31.8 L26 21 V28.6 H20.5 Z"/>
    <rect x="39.6" y="25.8" width="5.4" height="2.8" rx="0.8" fill="#34d399"/>

    <!-- Screen glare -->
    <path d="M10.2 4.6 H30 L18 33.2 H10.2 Z" fill="#ffffff" fill-opacity="0.05"/>

    <!-- Hinge -->
    <rect x="9" y="35.5" width="46" height="0.9" rx="0.45" fill="#0b0d10"/>

    <!-- Deck, keyboard area, front lip, thumb notch -->
    <path d="M5 36.2 H59 L62.6 40.6 H1.4 Z" fill="url(#deck)"/>
    <path d="M14 36.9 H50 L51.6 39 H12.4 Z" fill="#000000" fill-opacity="0.28"/>
    <path d="M1.4 40.6 H62.6 V41.3 Q62.6 42.4 61.3 42.4 H2.7 Q1.4 42.4 1.4 41.3 Z" fill="url(#lip)"/>
    <rect x="28" y="40.6" width="8" height="0.8" rx="0.4" fill="#111827"/>
  </g>

  <!-- Wordmark -->
  <text x="32" y="58.5" text-anchor="middle"
    font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="9.6" font-weight="700" letter-spacing="0.9">
    <tspan fill="#9ca3af">DEV</tspan><tspan fill="url(#word)">FOLIO</tspan>
  </text>
</svg>
