<!-- Left: Logo -->
<a routerLink="/" class="flex items-center space-x-3 group cursor-pointer">
  <div class="relative">
    <div
      class="h-12 w-12 rounded-xl bg-gradient-to-br from-accent to-accent-strong flex items-center justify-center text-2xl font-bold text-on-accent shadow-lg group-hover:scale-110 transition-transform duration-300">
      K
    </div>
    <div
      class="absolute -inset-1 bg-accent/20 rounded-xl blur-md group-hover:bg-accent/40 transition-all duration-300">
    </div>
  </div>
  <div class="flex flex-col">
    <span class="text-fg text-xl font-bold tracking-wide">KENNICHE</span>
    <span class="text-accent text-xs font-medium">{{ 'HERO.SOFTWARE_ENGINEER' | translate }}</span>
  </div>
</a>

<!-- Center: Navigation Links -->
<div class="hidden md:flex items-center space-x-1">
  @for (link of navigationLinks; track link) {
<a routerLinkActive="text-accent" (click)="linkClicked.emit(link.url)" class="relative text-fg-soft px-4 py-2 text-sm font-medium transition-all duration-300 hover:text-accent group
    rounded-lg hover:bg-overlay/5 cursor-pointer">
      {{ link.label | translate }}
      <span
        class="absolute left-1/2 -translate-x-1/2 bottom-0 w-0 h-0.5 bg-accent transition-all duration-300 group-hover:w-3/4">
      </span>
    </a>
  }
</div>

<!-- Right: Social + Language -->
<div class="hidden md:flex items-center space-x-4">
  @for (link of accountsLinks; track link) {
    <a [href]="link.url" target="_blank" rel="noopener noreferrer"
        [attr.aria-label]="link.label" class="group h-9 w-9 rounded-lg bg-overlay/5 flex items-center justify-center
           border border-overlay/10
           hover:bg-gradient-to-br hover:from-accent
           hover:via-primary hover:to-secondary
           hover:border-transparent
           transition-all duration-300">
        <img [src]="link.icon" [alt]="link.label" class="w-4 h-4 transition-all duration-300
               group-hover:brightness-0 group-hover:invert" />
    </a>
  }

  <!-- Theme Toggle -->
  <app-theme-toggle />

  <!-- Language Selector -->
  <div class="relative">
    <button id="language-button" (click)="languageMenuToggled.emit()"
      class="h-10 px-3 rounded-lg bg-overlay/10 hover:bg-overlay/20 flex items-center justify-center gap-2 transition-all duration-300 border border-overlay/20 hover:border-accent/50 group"
      aria-label="Change language">
      <fa-icon [icon]="faGlobe" class="text-accent"></fa-icon>
      <span class="text-fg text-sm font-semibold">{{ currentLanguage | uppercase }}</span>
    </button>

    <!-- Language Dropdown -->
    @if (languageMenuOpen) {
      <div id="language-menu"
        class="absolute top-full mt-2 right-0 bg-surface/95 backdrop-blur-md border border-overlay/20 rounded-xl shadow-2xl overflow-hidden min-w-[180px] animate-fade-in">
        @for (language of availableLanguages; track language) {
<button (click)="languageChanged.emit(language.code)" [class]="currentLanguage === language.code
              ? 'bg-accent/20 text-accent'
              : 'text-fg-soft hover:bg-overlay/10 hover:text-accent'"
            class="w-full px-4 py-3 flex items-center gap-3 transition-all duration-200">
            <span class="text-xl">{{ language.flag }}</span>
            <div class="flex flex-col items-start">
              <span class="text-sm font-semibold">{{ language.code | uppercase }}</span>
              <span class="text-xs opacity-80">{{ language.name }}</span>
            </div>
            @if (currentLanguage === language.code) {
              <svg class="w-4 h-4 ml-auto" fill="currentColor"
                viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                  d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z"
                  clip-rule="evenodd" />
              </svg>
            }
          </button>
        }
      </div>
    }
  </div>
</div>
