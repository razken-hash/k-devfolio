<svg
  viewBox="0 0 64 45"
  class="logo-svg overflow-visible"
  [class]="sizes().svg"
  role="img"
  aria-label="K Devfolio">
  <defs>
    <linearGradient [attr.id]="ids.k" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" class="stop-soft" />
      <stop offset="100%" class="stop-accent" />
    </linearGradient>
    <linearGradient [attr.id]="ids.lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3038" />
      <stop offset="100%" stop-color="#16191e" />
    </linearGradient>
    <linearGradient [attr.id]="ids.display" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e2117" />
      <stop offset="100%" stop-color="#030805" />
    </linearGradient>
    <linearGradient [attr.id]="ids.deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b7280" />
      <stop offset="100%" stop-color="#4b5563" />
    </linearGradient>
    <linearGradient [attr.id]="ids.lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
    <filter [attr.id]="ids.glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter [attr.id]="ids.shadow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="1" />
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="32" cy="43.6" rx="29" ry="1.4" fill="rgb(0 0 0 / 0.35)" [attr.filter]="url(ids.shadow)" />

  <!-- Lid & bezel -->
  <rect x="8" y="1.5" width="48" height="34" rx="3" [attr.fill]="url(ids.lid)" stroke="#4b5563" stroke-width="0.6" />
  <!-- Webcam -->
  <circle cx="32" cy="3.1" r="0.55" fill="#0b0d10" stroke="#3b4048" stroke-width="0.3" />

  <!-- Display -->
  <rect x="10.2" y="4.6" width="43.6" height="28.6" rx="0.8" [attr.fill]="url(ids.display)" />
  <rect class="logo-display-tint" x="10.2" y="4.6" width="43.6" height="28.6" rx="0.8" />

  <!-- K + cursor -->
  <text
    class="logo-k"
    x="29" y="25.5"
    text-anchor="middle"
    [attr.fill]="url(ids.k)"
    [attr.filter]="url(ids.glow)">K</text>
  <rect class="logo-cursor" x="36.6" y="23.3" width="4.6" height="2" rx="0.6" />

  <!-- Screen glare -->
  <path d="M10.2 4.6 H30 L18 33.2 H10.2 Z" fill="rgb(255 255 255 / 0.05)" />

  <!-- Hinge -->
  <rect x="9" y="35.5" width="46" height="0.9" rx="0.45" fill="#0b0d10" />

  <!-- Deck, keyboard area, front lip, thumb notch -->
  <path d="M5 36.2 H59 L62.6 40.6 H1.4 Z" [attr.fill]="url(ids.deck)" />
  <path d="M14 36.9 H50 L51.6 39 H12.4 Z" fill="rgb(0 0 0 / 0.28)" />
  <path d="M1.4 40.6 H62.6 V41.3 Q62.6 42.4 61.3 42.4 H2.7 Q1.4 42.4 1.4 41.3 Z" [attr.fill]="url(ids.lip)" />
  <rect x="28" y="40.6" width="8" height="0.8" rx="0.4" fill="#111827" />
</svg>

<!-- Wordmark -->
@if (showWordmark()) {
  <div class="flex items-center font-semibold uppercase leading-none" [class]="sizes().word">
    <span class="text-fg-muted">Dev</span><span class="logo-word-accent">folio</span>
  </div>
}
