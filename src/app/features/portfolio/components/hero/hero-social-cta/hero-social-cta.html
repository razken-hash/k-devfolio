<div class="w-full space-y-6 ">

  <!-- Social Links -->
  <div class="flex items-center justify-center lg:justify-start gap-4 sm:gap-6 pt-2 sm:pt-6">

    @for (account of accountsLinks; track account) {
      <div
        class="group w-12 h-12 sm:w-14 sm:h-14 relative flex items-center justify-center">
        <!-- Animated border -->
        <div class="absolute w-full h-full rounded-full p-[3px] animate-spin-slow"
          style="background: conic-gradient(from 0deg, rgb(var(--color-accent-strong)), rgb(var(--color-primary)), rgb(var(--color-primary-strong)), rgb(var(--color-accent-strong)));">
        </div>
        <!-- Background -->
            <div class="absolute w-[calc(100%-6px)] h-[calc(100%-6px)] rounded-full bg-white
                   group-hover:bg-gradient-to-br group-hover:from-accent
                   group-hover:via-primary group-hover:to-secondary
                   transition-all duration-500">
        </div>
        <!-- Social Link -->
            <a [href]="account.url" target="_blank" rel="noopener noreferrer" [attr.aria-label]="account.label" class="relative z-10 w-full h-full rounded-full flex items-center justify-center
                   transition-all duration-500 group-hover:scale-110">
                <img [src]="account.icon" [alt]="account.label" class="w-6 h-6 sm:w-7 sm:h-7 object-contain
                       transition-all duration-500
                       group-hover:brightness-0 group-hover:invert" />
        </a>
      </div>
    }

  </div>
  <!-- CTA Buttons -->
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 w-[70vw] sm:w-[490px] max-w-md lg:max-w-xl mx-auto lg:mx-0 pt-2">
        <a routerLink="/blog" class="group inline-flex items-center justify-center w-full px-8 py-4 text-base font-semibold
                   rounded-xl shadow-lg text-on-accent bg-gradient-to-r from-accent to-primary
                   hover:from-accent-strong hover:to-primary-strong transition-all duration-300
                   hover:shadow-accent/50 hover:scale-105">
      {{ 'HERO.DISCOVER_BLOG' | translate }}
      <fa-icon [icon]="faArrowRight" class="ml-2 group-hover:translate-x-1 transition-transform"></fa-icon>
    </a>
    <app-cv-preview class="w-full"></app-cv-preview>
  </div>

</div>
